[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mirage"
version = "0.1.0"
description = "The backtest lie detector - overfitting diagnostics for trading strategies"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy==2.2.6",
    "pandas==2.2.3",
    "scipy==1.15.3",
    "scikit-learn==1.6.1",
    "matplotlib==3.10.3",
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "pydantic==2.11.4",
    "typer==0.15.3",
    "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.9", "httpx==0.28.1"]
# optional: user-local Yahoo fetch + rebuilding the World Bank subset
data = ["yfinance==0.2.66", "openpyxl==3.1.5"]

[project.scripts]
mirage = "mirage.cli:app"

[tool.setuptools.packages.find]
include = ["mirage*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "B008"]  # B008: typer/FastAPI option-in-default is idiomatic

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false
